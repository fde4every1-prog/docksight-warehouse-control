<symbol id="boxes" viewBox="0 0 24 24"><g class="icon"><path d="m12 2 9 5v10l-9 5-9-5V7ZM3 7l9 5 9-5M12 12v10M8 4l9 5v4"/></g></symbol>
<symbol id="robot" viewBox="0 0 24 24"><g class="icon"><rect x="4" y="6" width="16" height="14" rx="3"/><path d="M12 6V2M2 10v6M22 10v6M9 16h6M7 20v2M17 20v2"/><circle cx="8" cy="11" r="1"/><circle cx="16" cy="11" r="1"/></g></symbol>
