<symbol id="database" viewBox="0 0 24 24"><g class="icon"><ellipse cx="12" cy="5" rx="9" ry="4"/><path d="M3 5v14c0 5 18 5 18 0V5M3 12c0 5 18 5 18 0"/></g></symbol>
