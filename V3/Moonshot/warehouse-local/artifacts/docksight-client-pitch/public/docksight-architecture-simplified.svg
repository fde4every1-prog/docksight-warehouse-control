<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>DockSight — Application Architecture</title>
<desc>Simplified logical architecture with users, browser workspaces, application services, background jobs and a database. Dashed outgoing arrows indicate proposed integrations, not implemented connections.</desc>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#25364b}
.title{font-size:38px;font-weight:700;letter-spacing:-1px}
.section{font-size:21px;font-weight:700}
.label{font-size:20px;font-weight:600}
.small{font-size:16px;fill:#718095}
.tiny{font-size:13px;fill:#718095}
.icon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.arrow{fill:none;stroke:#97a6b6;stroke-width:2;marker-end:url(#tip)}
</style>
<marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#97a6b6" stroke-width="1.8"/></marker>
<symbol id="person" viewBox="0 0 24 24"><g class="icon"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3M8 22v-4M16 22v-4"/></g></symbol>
